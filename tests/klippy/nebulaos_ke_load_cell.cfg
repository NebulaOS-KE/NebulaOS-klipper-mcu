# NebulaOS Phase 1.7 - offline config-parse proof for the KE's intended
# GD32F303 + HX711 load_cell_probe target, against upstream Klipper SHA
# 58bd67db3ce1be1951c3e4a6d1156a79903d4edc using this repo's own real
# GD32F303 build dictionary (out/klipper.dict). Steppers/heaters below are
# placeholder values sufficient to satisfy kinematics/config validation;
# only the [mcu] and [load_cell_probe] sections reflect the real KE target.
# Note: PA2/PA3 are reserved by [mcu] for the USART2 serial port and
# PA4/PC6 are reserved by [load_cell_probe] below for the HX711 - every
# other pin here is an arbitrary placeholder distinct from those four.
[stepper_x]
step_pin: PA8
dir_pin: PA9
enable_pin: !PA10
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA11
position_endstop: 0
position_max: 235
homing_speed: 50

[stepper_y]
step_pin: PA12
dir_pin: !PA13
enable_pin: !PA14
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA15
position_endstop: 0
position_max: 235
homing_speed: 50

[stepper_z]
step_pin: PB0
dir_pin: PB1
enable_pin: !PB2
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_max: 250

[extruder]
step_pin: PB5
dir_pin: PB6
enable_pin: !PB7
microsteps: 16
rotation_distance: 33.5
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PB9
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 300

[heater_bed]
heater_pin: PC8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC9
control: watermark
min_temp: 0
max_temp: 110

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100

[mcu]
serial: /dev/ttyS1
baud: 230400

# KE production target: HX711, Channel A / Gain 128, default 80 SPS,
# CLK=PA4, DOUT=PC6 (Phase 1.6/1.6B hardware forensics).
[load_cell_probe]
sensor_type: hx711
sclk_pin: PA4
dout_pin: PC6
gain: A-128
sample_rate: 80
z_offset: 0
speed: 2.0
counts_per_gram: 100
reference_tare_counts: 1000
trigger_force: 75
force_safety_limit: 2000
